<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Model Gallery</title>
<style>html,body{margin:0;height:100%;background:#222;overflow:hidden}canvas{display:block}#lbl{position:fixed;left:8px;top:6px;color:#fff;font:12px system-ui;text-shadow:0 1px 2px #000}</style>
<script type="importmap">
{ "imports": { "three": "https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.module.min.js",
               "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }
</script></head>
<body><div id="lbl"></div>
<script type="module">
// Gallery for js/models.js (v2 four-faction layout).
// ?shot=quad | base0..base3 | units0..units3   (&night=1)
import * as THREE from 'three';
import { makeModel, updateModels, decorateBase, preloadModels } from '../js/models.js';
await preloadModels(THREE);
const q = new URLSearchParams(location.search), shot = q.get('shot') || 'quad', night = q.get('night') === '1';
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2)); renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.setScissorTest(true); renderer.autoClear = true;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x3a3430);
scene.add(new THREE.HemisphereLight(night ? 0x6070a0 : 0xfff0d8, 0x5a4a3b, night ? 0.35 : 1.0));
const sun = new THREE.DirectionalLight(night ? 0x8090c0 : 0xfff0dc, night ? 0.5 : 2.4); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048); Object.assign(sun.shadow.camera, { left: -45, right: 45, top: 45, bottom: -45, near: 1, far: 300 }); sun.shadow.bias = -0.0005;
scene.add(sun, sun.target);
const FACTIONS = ['vanguard', 'volcanic', 'earth', 'storm'];
const BASES = [[-200, 110], [200, -110], [-200, -110], [200, 110]];
const GROUND = [0x6a6660, 0x3a2a26, 0x5f7a45, 0xf0c890];
const gtex = new THREE.TextureLoader().load('../assets/ground.jpg'); gtex.wrapS = gtex.wrapT = THREE.RepeatWrapping; gtex.repeat.set(12, 12); gtex.colorSpace = THREE.SRGBColorSpace;
BASES.forEach(([x, z], t) => { const m = new THREE.Mesh(new THREE.PlaneGeometry(200, 200), new THREE.MeshStandardMaterial({ map: t === 3 ? gtex : null, color: GROUND[t], roughness: 1 }));
  m.rotation.x = -Math.PI / 2; m.position.set(x, 0, z); m.receiveShadow = true; scene.add(m); });
let n = 0;
function put(kind, team, x, z, ry = 0) { const m = makeModel(THREE, kind, team, FACTIONS[team]); if (!m) return null; m.position.set(x, 0, z); m.rotation.y = ry; scene.add(m); n++; return m; }
BASES.forEach(([bx, bz], team) => {
  const sx = -Math.sign(bx), face = Math.atan2(-bz, -bx);
  put('cc', team, bx, bz); put('barracks', team, bx + 10 * sx, bz + 10); put('factory', team, bx + 10 * sx, bz - 10);
  decorateBase(THREE, scene, team, bx, bz, FACTIONS[team]);
  const P = (R, da) => [bx + Math.cos(face + da) * R, bz + Math.sin(face + da) * R];
  const tur = (k, R, da) => { const [x, z] = P(R, da); const m = put(k, team, x, z); if (m?.userData.turret) m.userData.turret.rotation.y = -(face + da); };
  tur('turret_mg', 17, 0.45); tur('turret_mg', 17, -0.45); tur('turret_cannon', 15, 0.9); tur('turret_cannon', 15, -0.9);
  tur('artillery', 12, Math.PI / 2); tur('artillery', 12, -Math.PI / 2);
  for (let i = -5; i <= 5; i++) { if (!i) continue; const a = face + i * 0.18; put('wall', team, bx + Math.cos(a) * 22, bz + Math.sin(a) * 22, -a - Math.PI / 2); }
  put('gate', team, bx + Math.cos(face) * 22, bz + Math.sin(face) * 22, -face);
  const ux = bx + Math.cos(face) * 13, uz = bz + Math.sin(face) * 13;
  ['tank', 'raider', 'harvester', 'tank', 'raider'].forEach((k, i) => put(k, team, ux + (i % 3) * 4.5 - 4, uz + ((i / 3) | 0) * 4.5 - 2, -face));
  ['tank', 'raider', 'harvester', 'turret_mg', 'turret_cannon', 'artillery', 'wall', 'gate'].forEach((k, i) => put(k, team, bx - 30 + i * 5.4, bz + 40, -0.5));
  const SPEC = [['vanguard_flak'], ['volcanic_juggernaut', 'volcanic_ash_cannon'], ['earth_sunwing', 'earth_glider', 'earth_burrower', 'earth_mound'], ['storm_yacht', 'storm_kite']][team];
  SPEC.forEach((k, i) => { const m = put(k, team, bx - 30 + i * 6, bz + 48, -0.5); if (m?.userData.air) m.position.y = 6; });
});
for (let i = 0; i < 4; i++) { put('crystal', -1, -230 + i * 3, 160); put('rock', -1, -230 + i * 3, 166); }
const cams = BASES.map(() => new THREE.PerspectiveCamera(50, 1, 0.5, 600));
function aim(cam, tx, tz, dist, pitch) { const p = pitch * Math.PI / 180; cam.position.set(tx, Math.sin(p) * dist, tz + Math.cos(p) * dist); cam.lookAt(tx, 0, tz); }
const views = [], W = innerWidth, H = innerHeight;
if (shot === 'quad') BASES.forEach(([x, z], t) => { aim(cams[t], x + 3, z, 50, 65); views.push([cams[t], (t % 2) * W / 2, (t < 2 ? H / 2 : 0), W / 2, H / 2, x, z]); });
else if (shot.startsWith('base')) { const t = +shot[4]; const [x, z] = BASES[t]; aim(cams[0], x + 3, z, 44, 65); views.push([cams[0], 0, 0, W, H, x, z]); }
else { const t = +shot[5]; const [x, z] = BASES[t]; aim(cams[0], x - 13, z + 44, 24, 50); views.push([cams[0], 0, 0, W, H, x - 13, z + 44]); }
for (const v of views) { v[0].aspect = v[3] / v[4]; v[0].updateProjectionMatrix(); }
const t0 = performance.now();
function frame() {
  updateModels(0.016, (performance.now() - t0) / 1000 + 3);
  let calls = 0;
  for (const [cam, x, y, w, h, tx, tz] of views) { sun.position.set(tx - 50, 90, tz + 30); sun.target.position.set(tx, 0, tz); sun.target.updateMatrixWorld();
    renderer.setViewport(x, y, w, h); renderer.setScissor(x, y, w, h); renderer.render(scene, cam); calls += renderer.info.render.calls; }
  document.getElementById('lbl').textContent = `${shot} · ${n} models · ${calls} calls`;
  requestAnimationFrame(frame);
}
frame();
window.__ready = true;
window.__calls = () => { const out = {}; for (const k of ['tank', 'raider', 'harvester', 'turret_mg', 'turret_cannon', 'artillery', 'wall', 'gate', 'cc', 'barracks', 'factory']) for (let t = 0; t < 4; t++) { const m = makeModel(THREE, k, t, FACTIONS[t]); let c = 0; m?.traverse(o => { if (o.isMesh) c++; }); out[k + t] = c; } return out; };
</script></body></html>
